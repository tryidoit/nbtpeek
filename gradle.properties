# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties (same values as the official Fabric example mod for 26.3)
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19-SNAPSHOT
fabric_api_version=0.165.0+26.3

# Mod Menu (compile-only, optional at runtime). 21.0.0 is the release for 26.3.
# Set enable_modmenu=false to build without it (no in-game settings screen then).
enable_modmenu=true
modmenu_version=21.0.0

# Mod Properties
mod_version=1.3.0
maven_group=dev.nbtpeek
archives_base_name=nbtpeek
